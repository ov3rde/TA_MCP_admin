[script:ta_mcp_admin_settings]
match = /ta_mcp_admin/settings
script = admin_settings_handler.py
handler = admin_settings_handler.AdminSettingsHandler
python.version = python3
requireAuthentication = true
capability = mcp_tool_admin
output_modes = json
scripttype = persist
passSystemAuth = true
passPayload = true
passSession = true
passHttpHeaders = true

[script:ta_mcp_admin_tools_admin]
match = /ta_mcp_admin/tools_admin
script = tools_admin_handler.py
handler = tools_admin_handler.ToolsAdminHandler
python.version = python3
requireAuthentication = true
capability = mcp_tool_admin
output_modes = json
scripttype = persist
passSystemAuth = true
passPayload = true
passSession = true
passHttpHeaders = true
